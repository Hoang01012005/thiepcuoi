<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="40%" stop-color="#C6A46A"/>
      <stop offset="75%" stop-color="#9F7E46"/>
      <stop offset="100%" stop-color="#5C4518"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC89F"/>
      <stop offset="50%" stop-color="#C6A46A"/>
      <stop offset="100%" stop-color="#B88655"/>
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="50" cy="50" r="48" fill="#FAF7F0" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Botanical Wreath Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#roseGold)" stroke-width="1.2" stroke-dasharray="28 4 12 4 40 4"/>

  <!-- Floral Petals Accent on top & bottom -->
  <g fill="none" stroke="url(#roseGold)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-right delicate leaves -->
    <path d="M 68 28 C 72 24, 76 25, 78 28 C 76 32, 72 31, 68 28 Z" fill="#FAF7F0"/>
    <path d="M 74 34 C 79 32, 82 35, 82 39 C 78 40, 75 37, 74 34 Z" fill="#FAF7F0"/>
    <!-- Bottom-left delicate leaves -->
    <path d="M 32 72 C 28 76, 24 75, 22 72 C 24 68, 28 69, 32 72 Z" fill="#FAF7F0"/>
    <path d="M 26 66 C 21 68, 18 65, 18 61 C 22 60, 25 63, 26 66 Z" fill="#FAF7F0"/>
  </g>

  <!-- Centered Serif Monogram N & H -->
  <text x="50" y="56" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#40352F" text-anchor="middle" letter-spacing="1.5">N&amp;H</text>
</svg>
