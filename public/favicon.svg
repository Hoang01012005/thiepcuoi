<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C79E"/>
      <stop offset="50%" stop-color="#C98291"/>
      <stop offset="100%" stop-color="#D5B58C"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#FFF9F6" stroke="url(#gold)" stroke-width="2"/>
  <!-- Two intertwined rings -->
  <circle cx="26" cy="32" r="14" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="38" cy="32" r="14" fill="none" stroke="#D5B58C" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 20"/>
  <!-- Small diamond spark on top ring -->
  <polygon points="26,14 28,18 26,22 24,18" fill="#C98291"/>
</svg>